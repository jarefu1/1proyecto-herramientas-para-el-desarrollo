name: Prueba Docker del frontend
on:
  push:
    branches: [leo/docker-frontend]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t mhm-store-frontend:local .
      - name: Probar las rutas del contenedor
        run: |
          docker run -d --rm --name mhm-store-frontend -p 127.0.0.1:8080:80 mhm-store-frontend:local
          trap 'docker logs mhm-store-frontend; docker stop mhm-store-frontend' EXIT
          base=http://127.0.0.1:8080
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 --max-time 3 "$base/" -o index-served.html -w '/ HTTP %{http_code}\n'
          for route in /catalogo /producto/1 /login /registro /admin/stock; do
            curl -fsS "$base$route" -o route-served.html -w "$route HTTP %{http_code}\n"
            cmp index-served.html route-served.html
          done
          script=$(grep -oE '/assets/[^" ]+\.js' index-served.html)
          curl -fsS "$base$script" -o /dev/null -w 'JavaScript HTTP %{http_code}\n'
          test "$(curl -sS "$base/assets/inexistente.js" -o /dev/null -w '%{http_code}')" = 404
